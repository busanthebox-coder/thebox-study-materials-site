<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e63946" />
  <title>답지 PDF 모음 | 더박스 답변</title>
  <link rel="stylesheet" href="assets/style.css?v=8" />
</head>
<body class="print-page">
  <header class="app-header">
    <div class="header-row">
      <a class="logo" href="index.html" aria-label="답변 앱으로 돌아가기">
        <span class="logo-mark">📚</span>
        <span class="logo-text">더박스 <em>답지 PDF</em></span>
      </a>
      <a class="header-link" href="index.html">답변 앱</a>
    </div>
    <div class="search-row">
      <input
        type="search"
        id="pdf-search"
        placeholder="답지 PDF 검색 (예: MONEY, dating, AI)"
        autocomplete="off"
        inputmode="search"
      />
      <button id="pdf-search-clear" class="icon-btn" aria-label="검색 지우기" hidden>✕</button>
    </div>
    <nav class="filter-row" id="pdf-category-filters" aria-label="PDF 카테고리 필터"></nav>
  </header>

  <main class="print-shell">
    <div class="print-toolbar">
      <div>
        <p class="print-kicker">Answer sheets</p>
        <h1>답지 PDF 모음</h1>
      </div>
      <p id="pdf-count" class="pdf-count"></p>
    </div>
    <section id="pdf-list" class="pdf-list" aria-live="polite">
      <p class="loading">답지 PDF 목록 불러오는 중…</p>
    </section>
  </main>

  <script src="assets/print.js?v=8" defer></script>
</body>
</html>
